# tars.giize.com nginx 설정에 추가할 location 블록.
# /etc/nginx/sites-enabled/tars 의 server { listen 443 ssl; server_name tars.giize.com; } 안에 삽입.
#
# 추가 후:
#   sudo nginx -t
#   sudo systemctl reload nginx

# /catchup → /catchup/ 로 리디렉트 (trailing slash 강제)
location = /catchup {
    return 301 /catchup/;
}

# /catchup/* 경로를 catchup 백엔드(localhost:8300)로 프록시
# proxy_pass에 trailing slash가 있으면 nginx가 location prefix를 잘라내고 보냄.
# 즉 /catchup/api/version → http://localhost:8300/api/version
location /catchup/ {
    proxy_pass http://localhost:8300/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE (text/event-stream) 지원: 버퍼링 끄기 + 긴 timeout
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Excel 다운로드 등 큰 응답 대비
    client_max_body_size 50M;
}
