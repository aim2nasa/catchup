<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>cafe24 판매 집계 — 캐치업코리아</title>
<style>
  :root {
    --c-bg: #f5f7fa;
    --c-surface: #ffffff;
    --c-text: #111827;
    --c-text-muted: #6b7280;
    --c-border: #e5e7eb;
    --c-border-strong: #cbd5e1;
    --c-primary: #2563eb;
    --c-primary-dark: #1d4ed8;
    --c-grand-bg: #0f172a;
    --c-grand-text: #f1f5f9;
    --c-grand-muted: #94a3b8;
    --c-grand-accent: #fbbf24;
    --c-cat-bar: #1e40af;
    --c-cat-bar-text: #f8fafc;
    --c-cat-bar-muted: #cbd5e1;
    --c-cat-num-bg: #fbbf24;
    --c-cat-num-text: #422006;
    --c-table-head: #334155;
    --c-table-head-hover: #475569;
    --c-table-head-text: #f8fafc;
    --c-row-alt: #f8fafc;
    --c-row-hover: #eff6ff;
    --c-row-parent-bg: #f1f5f9;
    --c-row-child-text: #6b7280;
    --c-sum-bg: #fef3c7;
    --c-sum-text: #78350f;
    --c-sum-border: #d97706;
    --c-error-bg: #fee2e2;
    --c-error-text: #991b1b;
    --c-error-border: #fca5a5;
    --c-progress-bg: #1e293b;
    --c-progress-text: #cbd5e1;
    --c-multi-tag-bg: #fbbf24;
    --c-multi-tag-text: #422006;
  }

  * { box-sizing: border-box; }
  body {
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "맑은 고딕", sans-serif;
    background: var(--c-bg);
    color: var(--c-text);
    margin: 0;
    padding: clamp(10px, 2vw, 18px);
  }
  .container { max-width: 1400px; margin: 0 auto; }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 14px;
    letter-spacing: -0.01em;
  }

  .card {
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: 8px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
  }

  .filters { padding: 12px 14px; margin-bottom: 12px; }
  .filters .row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .filters label {
    font-size: 12px;
    color: var(--c-text-muted);
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .filters input[type=date], .filters select {
    padding: 6px 10px;
    font-size: 13px;
    border: 1px solid var(--c-border-strong);
    border-radius: 4px;
    background: var(--c-surface);
    color: var(--c-text);
  }

  button {
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--c-border-strong);
    background: var(--c-surface);
    border-radius: 4px;
    color: var(--c-text);
    font-weight: 600;
  }
  button:hover:not([disabled]) { background: var(--c-row-hover); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary {
    background: var(--c-primary);
    color: white;
    border-color: var(--c-primary);
  }
  button.primary:hover:not([disabled]) {
    background: var(--c-primary-dark);
    border-color: var(--c-primary-dark);
  }

  .split-panel {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
    gap: 12px;
    margin-bottom: 14px;
  }
  @media (max-width: 800px) {
    .split-panel { grid-template-columns: 1fr; }
  }

  .left-pane, .right-pane {
    padding: 12px;
    display: flex;
    flex-direction: column;
    height: 60vh;
    min-height: 320px;
    max-height: 560px;
  }

  .summary-section {
    padding: 14px;
    margin-bottom: 14px;
  }
  .summary-section .cat-cards {
    max-height: 380px;
    overflow-y: auto;
  }
  .summary-section .pane-header label {
    font-size: 12px;
    color: var(--c-text-muted);
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .summary-section .pane-header select {
    padding: 4px 8px;
    font-size: 12px;
    border: 1px solid var(--c-border-strong);
    border-radius: 4px;
    background: var(--c-surface);
    color: var(--c-text);
    font-weight: 600;
  }

  .pane-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--c-border);
  }
  .pane-title { font-weight: 700; font-size: 13px; }
  .pane-controls { display: flex; gap: 4px; }
  .pane-controls button { font-size: 11px; padding: 3px 8px; font-weight: 500; }

  .cat-list {
    flex: 1 1 auto;
    overflow-y: auto;
    min-height: 0;
    margin-bottom: 10px;
  }
  .cat-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 6px;
    border: 1px solid transparent;
    border-radius: 3px;
    cursor: grab;
    user-select: none;
    margin-bottom: 0;
    line-height: 1.3;
  }
  .cat-item:hover {
    background: var(--c-row-hover);
    border-color: var(--c-border-strong);
  }
  .cat-item.dragging {
    opacity: 0.4;
    background: var(--c-row-alt);
  }
  .drag-handle {
    color: var(--c-text-muted);
    font-size: 16px;
    line-height: 1;
    letter-spacing: -3px;
    cursor: grab;
    width: 14px;
  }
  .cat-item .cat-no {
    font-family: ui-monospace, monospace;
    color: var(--c-text-muted);
    font-size: 11px;
    min-width: 36px;
  }
  .cat-item .cat-name { flex: 1; font-size: 12px; }

  .progress {
    background: var(--c-progress-bg);
    color: var(--c-progress-text);
    padding: 10px 12px;
    border-radius: 6px;
    flex: 1 1 auto;
    overflow-y: auto;
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
    font-size: 12px;
    white-space: pre-wrap;
    min-height: 0;
  }
  .error {
    background: var(--c-error-bg);
    color: var(--c-error-text);
    padding: 10px 12px;
    border-radius: 6px;
    margin-top: 10px;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    white-space: pre-wrap;
    display: none;
    border: 1px solid var(--c-error-border);
  }

  .summary { display: flex; flex-direction: column; gap: 10px; flex: 1; overflow-y: auto; }

  .grand-card {
    background: var(--c-grand-bg);
    color: var(--c-grand-text);
    padding: 12px 14px;
    border-radius: 6px;
  }
  .grand-card .label {
    color: var(--c-grand-muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }
  .grand-card .num {
    font-size: 20px;
    font-weight: 700;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .grand-card .num em { color: var(--c-grand-accent); font-style: normal; }
  .grand-card .num .sep { color: var(--c-grand-muted); margin: 0 8px; font-weight: 400; }

  .cat-cards {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .cat-card {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    background: var(--c-row-alt);
    border: 1px solid var(--c-border);
    border-radius: 4px;
    font-size: 12px;
  }
  .cat-card .cat-no-pill {
    background: var(--c-cat-num-bg);
    color: var(--c-cat-num-text);
    padding: 1px 7px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 700;
    font-family: ui-monospace, monospace;
  }
  .cat-card .cat-card-name {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cat-card .cat-card-stats {
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    color: var(--c-text-muted);
    text-align: right;
    white-space: nowrap;
  }
  .cat-card .cat-card-stats strong {
    color: var(--c-text);
    font-weight: 700;
    margin: 0 3px;
  }

  .tabs {
    border-bottom: 2px solid var(--c-border-strong);
    overflow-x: auto;
    white-space: nowrap;
    padding-bottom: 0;
    display: flex;
    gap: 2px;
  }
  .tabs button {
    background: var(--c-bg);
    border: 1px solid var(--c-border-strong);
    border-bottom: none;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    border-radius: 4px 4px 0 0;
    color: var(--c-text-muted);
    font-weight: 500;
  }
  .tabs button.active {
    background: var(--c-surface);
    color: var(--c-text);
    font-weight: 700;
    border-bottom: 2px solid var(--c-surface);
    position: relative;
    top: 2px;
  }
  .tab-content-tabs {
    border: 1px solid var(--c-border);
    border-top: none;
    background: var(--c-surface);
    max-height: 65vh;
    overflow: auto;
  }

  .flat-wrap {
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
  }

  .cat-section {
    background: var(--c-surface);
    border-radius: 8px;
    margin-bottom: 14px;
    border: 1px solid var(--c-border);
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
  }
  .cat-bar {
    background: var(--c-cat-bar);
    color: var(--c-cat-bar-text);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 14px;
    flex-wrap: wrap;
  }
  .cat-bar .cat-num {
    background: var(--c-cat-num-bg);
    color: var(--c-cat-num-text);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .cat-bar .cat-name { flex: 1; min-width: 200px; font-weight: 600; }
  .cat-bar .cat-stat {
    font-size: 12px;
    font-weight: 400;
    color: var(--c-cat-bar-muted);
  }
  .cat-bar .cat-stat strong {
    color: var(--c-cat-bar-text);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-left: 4px;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 12px;
  }
  table th, table td {
    border-bottom: 1px solid var(--c-border);
    padding: 6px 10px;
    text-align: left;
  }
  table th {
    background: var(--c-table-head);
    color: var(--c-table-head-text);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.04em;
    position: sticky;
    top: 0;
    z-index: 1;
    cursor: pointer;
    user-select: none;
  }
  table th:hover { background: var(--c-table-head-hover); }
  table th .sort-ind {
    display: inline-block;
    width: 12px;
    margin-left: 3px;
    opacity: 0.85;
    font-size: 10px;
  }

  table tbody tr.row-parent { background: var(--c-row-parent-bg); }
  table tbody tr.row-parent td.code-cell,
  table tbody tr.row-parent td.name-cell { font-weight: 600; }
  table tbody tr.row-child td.code-cell {
    color: var(--c-row-child-text);
    font-size: 11px;
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
    padding-left: 38px;
  }
  .toggle-btn {
    display: inline-block;
    width: 18px;
    height: 18px;
    font-size: 12px;
    line-height: 14px;
    padding: 0;
    margin-right: 6px;
    border: 1px solid var(--c-border-strong);
    background: var(--c-surface);
    cursor: pointer;
    font-weight: 700;
    color: var(--c-text);
    border-radius: 3px;
    vertical-align: middle;
  }
  .toggle-btn:hover { background: var(--c-row-hover); }
  tr.row-child.collapsed { display: none; }

  table tbody tr.row-child td.name-cell {
    color: var(--c-row-child-text);
    padding-left: 24px;
  }
  table tbody tr.row-child td.cat-cell { color: var(--c-text-muted); font-size: 11px; }
  table tbody tr.row-single:hover,
  table tbody tr.row-parent:hover,
  table tbody tr.row-child:hover { background: var(--c-row-hover); }

  table .num {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  table tfoot td {
    font-weight: 700;
    background: var(--c-sum-bg);
    color: var(--c-sum-text);
    border-top: 2px solid var(--c-sum-border);
    border-bottom: none;
  }

  .multi-tag {
    display: inline-block;
    background: var(--c-multi-tag-bg);
    color: var(--c-multi-tag-text);
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 8px;
    margin-left: 6px;
    vertical-align: 1px;
  }

  .view-toggle-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .view-toggle-wrap .view-label {
    font-size: 12px;
    color: var(--c-text-muted);
    font-weight: 600;
  }
  .view-toggle {
    display: inline-flex;
    border: 1px solid var(--c-border-strong);
    border-radius: 6px;
    overflow: hidden;
  }
  .view-toggle button {
    border: none;
    border-right: 1px solid var(--c-border-strong);
    background: var(--c-surface);
    padding: 6px 14px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 600;
    color: var(--c-text-muted);
    border-radius: 0;
  }
  .view-toggle button:last-child { border-right: none; }
  .view-toggle button.active {
    background: var(--c-primary);
    color: white;
  }
  .view-toggle button:not(.active):hover {
    background: var(--c-row-hover);
  }

  .hidden { display: none; }

  .version-footer {
    text-align: center;
    font-size: 11px;
    color: var(--c-text-muted);
    padding: 12px 0 4px;
    margin-top: 16px;
    font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  .version-footer .vm { color: var(--c-text-muted); margin: 0 6px; opacity: 0.5; }
</style>
</head>
<body>
<div class="container">
<h1>cafe24 판매 집계 — 캐치업코리아</h1>

<div class="filters card">
  <div class="row">
    <label>시작일 <input type="date" id="start"></label>
    <label>종료일 <input type="date" id="end"></label>
    <select id="mode" style="display:none">
      <option value="single" selected>한 화면 (카테고리별 그룹)</option>
      <option value="tabs">카테고리별 탭 분리</option>
      <option value="flat">통합 (카테고리 무관 한 표)</option>
    </select>
    <button id="run" class="primary" style="margin-left:auto">조회</button>
    <button id="dl" disabled>Excel 다운로드</button>
  </div>
</div>

<div class="split-panel">
  <div class="left-pane card">
    <div class="pane-header">
      <span class="pane-title">카테고리 (드래그로 순서 변경)</span>
      <div class="pane-controls">
        <button onclick="selectAllCats(true)">전체</button>
        <button onclick="selectAllCats(false)">해제</button>
      </div>
    </div>
    <div class="cat-list" id="cats">로딩...</div>
  </div>

  <div class="right-pane card">
    <div class="pane-header">
      <span class="pane-title" id="rightTitle">진행 상황</span>
    </div>
    <div class="progress" id="progress"></div>
    <div class="error" id="error"></div>
  </div>
</div>

<div class="summary-section card hidden" id="summaryWrap">
  <div class="pane-header">
    <span class="pane-title">결과 요약</span>
    <label>정렬
      <select id="catSortSummary">
        <option value="rev:-1" selected>매출 ↓</option>
        <option value="rev:1">매출 ↑</option>
        <option value="qty:-1">판매수 ↓</option>
        <option value="qty:1">판매수 ↑</option>
        <option value="user">사용자 지정 (드래그 순서)</option>
      </select>
    </label>
  </div>
  <div class="grand-card" id="grandSummary"></div>
  <div class="cat-cards" id="catCards"></div>
</div>

<div id="grandWrap" class="hidden">
  <div class="view-toggle-wrap">
    <span class="view-label">표시</span>
    <div class="view-toggle" id="viewToggle">
      <button type="button" data-mode="single" class="active">한 화면 (카테고리별 그룹)</button>
      <button type="button" data-mode="tabs">카테고리별 탭 분리</button>
      <button type="button" data-mode="flat">통합 (카테고리 무관 한 표)</button>
    </div>
  </div>
  <div class="tabs hidden" id="tabs"></div>
  <div id="results"></div>
</div>

<footer class="version-footer" id="versionFooter">v...</footer>
</div>
<script>
let allCats = [];
let lastResult = null;
let lastQuery = null;
let evt = null;
let sortBy = 'rev';
let sortDir = -1;
let runStartedAt = null;
let _gidCounter = 0;
let catOrder = [];
let summarySort = 'rev:-1';

const STORAGE_KEY = 'catchup-settings-v1';
function saveSettings() {
  try {
    const cb = {};
    document.querySelectorAll('.cat-cb').forEach(c => { cb[c.value] = c.checked; });
    const s = {
      start: document.getElementById('start').value,
      end: document.getElementById('end').value,
      mode: document.getElementById('mode').value,
      summarySort: summarySort,
      catOrder: catOrder,
      catChecked: cb,
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  } catch (e) { /* ignore quota/storage errors */ }
}
function loadSettings() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function toggleGroup(btn, gid) {
  const willCollapse = btn.textContent === '−';
  document.querySelectorAll('tr[data-group="' + gid + '"]').forEach(tr => {
    tr.classList.toggle('collapsed', willCollapse);
  });
  btn.textContent = willCollapse ? '+' : '−';
}

const today = new Date();
const lm = new Date(today.getFullYear(), today.getMonth() - 1, 1);
const lmEnd = new Date(today.getFullYear(), today.getMonth(), 0);
function toIso(d) { return d.toISOString().slice(0, 10); }
const _saved = loadSettings();
document.getElementById('start').value = (_saved && _saved.start) || toIso(lm);
document.getElementById('end').value = (_saved && _saved.end) || toIso(lmEnd);
if (_saved && _saved.mode) document.getElementById('mode').value = _saved.mode;
if (_saved && _saved.summarySort) summarySort = _saved.summarySort;
window.addEventListener('DOMContentLoaded', () => { try { syncViewToggle(); } catch (e) {} });

async function loadCats() {
  try {
    const r = await fetch('/api/categories');
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      throw new Error(j.error || ('HTTP ' + r.status));
    }
    const data = await r.json();
    allCats = data.filter(c => c.depth === 1);
    const saved = loadSettings();
    if (saved && Array.isArray(saved.catOrder)) {
      const have = new Set(allCats.map(c => c.no));
      const savedFiltered = saved.catOrder.filter(no => have.has(no));
      const newOnes = allCats.map(c => c.no).filter(no => !saved.catOrder.includes(no));
      catOrder = savedFiltered.concat(newOnes);
    } else {
      catOrder = allCats.map(c => c.no);
    }
    buildCatList();
    if (saved && saved.catChecked) {
      document.querySelectorAll('.cat-cb').forEach(cb => {
        if (Object.prototype.hasOwnProperty.call(saved.catChecked, cb.value)) {
          cb.checked = !!saved.catChecked[cb.value];
        }
      });
    }
  } catch (e) {
    document.getElementById('cats').innerHTML = '<span style="color:var(--c-error-text)">카테고리 로딩 실패: ' + escapeHtml(String(e)) + '</span>';
  }
}

function buildCatList() {
  const container = document.getElementById('cats');
  container.innerHTML = '';
  catOrder.forEach(no => {
    const cat = allCats.find(c => c.no === no);
    if (!cat) return;
    const item = document.createElement('div');
    item.className = 'cat-item';
    item.draggable = true;
    item.dataset.no = no;
    item.innerHTML =
      '<span class="drag-handle">⋮⋮</span>' +
      '<input type="checkbox" class="cat-cb" value="' + no + '" checked>' +
      '<span class="cat-no">[' + no + ']</span>' +
      '<span class="cat-name">' + escapeHtml(cat.name) + '</span>';
    item.addEventListener('dragstart', () => item.classList.add('dragging'));
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      catOrder = Array.from(container.children).map(it => parseInt(it.dataset.no, 10));
      saveSettings();
    });
    item.querySelector('.cat-cb').addEventListener('change', saveSettings);
    container.appendChild(item);
  });
  container.addEventListener('dragover', (e) => {
    e.preventDefault();
    const dragging = container.querySelector('.dragging');
    if (!dragging) return;
    const after = getDragAfterElement(container, e.clientY);
    if (after == null) container.appendChild(dragging);
    else container.insertBefore(dragging, after);
  });
}

function getDragAfterElement(container, y) {
  const items = [...container.querySelectorAll('.cat-item:not(.dragging)')];
  return items.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) return { offset, element: child };
    return closest;
  }, { offset: Number.NEGATIVE_INFINITY, element: null }).element;
}

function selectAllCats(state) {
  document.querySelectorAll('.cat-cb').forEach(cb => cb.checked = state);
  saveSettings();
}

function selectedCats() {
  const checked = new Set(Array.from(document.querySelectorAll('.cat-cb:checked')).map(cb => parseInt(cb.value, 10)));
  return catOrder.filter(no => checked.has(no)).join(',');
}

function fmt(n, currency) {
  const sign = currency === 'KRW' ? '₩' : '';
  return sign + Number(n).toLocaleString('ko-KR', { maximumFractionDigits: 0 });
}

function pushProgress(msg) {
  const el = document.getElementById('progress');
  el.classList.remove('hidden');
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}

function showError(msg) {
  const el = document.getElementById('error');
  el.style.display = 'block';
  el.textContent = msg;
}
function clearError() {
  const el = document.getElementById('error');
  el.style.display = 'none';
  el.textContent = '';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function getGroupVal(g, key) {
  if (key === 'code') return g.product_code || '';
  if (key === 'name') return g.product_name || '';
  if (key === 'price') return g.price || 0;
  if (key === 'qty') return g.qty || 0;
  if (key === 'rev') return g.rev || 0;
  return 0;
}
function getVariantVal(v, parentPrice, key) {
  if (key === 'code') return v.variant_code || '';
  if (key === 'name') return v.option || v.variant_code || '';
  if (key === 'price') return parentPrice || 0;
  if (key === 'qty') return v.qty || 0;
  if (key === 'rev') return v.rev || 0;
  return 0;
}
function cmp(a, b, dir) {
  if (typeof a === 'string' || typeof b === 'string') {
    return String(a).localeCompare(String(b), 'ko-KR') * dir;
  }
  return ((a < b) ? -1 : (a > b) ? 1 : 0) * dir;
}
function sortGroups(groups) {
  return [...groups].sort((a, b) => cmp(getGroupVal(a, sortBy), getGroupVal(b, sortBy), sortDir));
}
function sortVariants(vars, parentPrice) {
  return [...vars].sort((a, b) => cmp(getVariantVal(a, parentPrice, sortBy), getVariantVal(b, parentPrice, sortBy), sortDir));
}

function setSort(col) {
  if (sortBy === col) sortDir = -sortDir;
  else { sortBy = col; sortDir = -1; }
  reRenderResults();
}

function indicator(col) {
  if (col !== sortBy) return '';
  return sortDir === -1 ? '▼' : '▲';
}

function renderTable(groups, totals, cur) {
  const head = '<tr>' +
    '<th onclick="setSort(\'code\')">코드<span class="sort-ind">' + indicator('code') + '</span></th>' +
    '<th onclick="setSort(\'name\')">상품명<span class="sort-ind">' + indicator('name') + '</span></th>' +
    '<th class="num" onclick="setSort(\'price\')">단가<span class="sort-ind">' + indicator('price') + '</span></th>' +
    '<th class="num" onclick="setSort(\'qty\')">판매수<span class="sort-ind">' + indicator('qty') + '</span></th>' +
    '<th class="num" onclick="setSort(\'rev\')">매출<span class="sort-ind">' + indicator('rev') + '</span></th>' +
  '</tr>';
  const sortedGroups = sortGroups(groups);
  const body = sortedGroups.map(g => {
    const cls = g.is_multi ? 'row-parent' : 'row-single';
    const tag = g.is_multi ? '<span class="multi-tag">' + g.variants.length + '개 옵션</span>' : '';
    const gid = g.is_multi ? 'g' + (++_gidCounter) : '';
    const toggleBtn = g.is_multi ? '<button class="toggle-btn" type="button" onclick="toggleGroup(this,\'' + gid + '\')">−</button>' : '';
    const parent =
      '<tr class="' + cls + '">' +
        '<td class="code-cell">' + toggleBtn + escapeHtml(g.product_code) + '</td>' +
        '<td class="name-cell">' + escapeHtml(g.product_name) + tag + '</td>' +
        '<td class="num">' + fmt(g.price, cur) + '</td>' +
        '<td class="num">' + g.qty.toLocaleString('ko-KR') + '</td>' +
        '<td class="num">' + fmt(g.rev, cur) + '</td>' +
      '</tr>';
    if (!g.is_multi) return parent;
    const children = sortVariants(g.variants, g.price).map(v => {
      const suffix = v.variant_code && v.variant_code.startsWith(g.product_code)
        ? v.variant_code.slice(g.product_code.length)
        : (v.variant_code || '');
      return '<tr class="row-child" data-group="' + gid + '">' +
        '<td class="code-cell">' + escapeHtml(suffix) + '</td>' +
        '<td class="name-cell">└ ' + escapeHtml(v.option || v.variant_code) + '</td>' +
        '<td class="num">' + fmt(g.price, cur) + '</td>' +
        '<td class="num">' + v.qty.toLocaleString('ko-KR') + '</td>' +
        '<td class="num">' + fmt(v.rev, cur) + '</td>' +
      '</tr>';
    }).join('');
    return parent + children;
  }).join('');
  const foot = '<tr><td colspan="3">합계</td><td class="num">' + totals.qty.toLocaleString('ko-KR') + '</td><td class="num">' + fmt(totals.rev, cur) + '</td></tr>';
  return '<table><thead>' + head + '</thead><tbody>' + body + '</tbody><tfoot>' + foot + '</tfoot></table>';
}

function renderFlatTable(data, cur) {
  const head = '<tr>' +
    '<th>카테고리</th>' +
    '<th onclick="setSort(\'code\')">코드<span class="sort-ind">' + indicator('code') + '</span></th>' +
    '<th onclick="setSort(\'name\')">상품명<span class="sort-ind">' + indicator('name') + '</span></th>' +
    '<th class="num" onclick="setSort(\'price\')">단가<span class="sort-ind">' + indicator('price') + '</span></th>' +
    '<th class="num" onclick="setSort(\'qty\')">판매수<span class="sort-ind">' + indicator('qty') + '</span></th>' +
    '<th class="num" onclick="setSort(\'rev\')">매출<span class="sort-ind">' + indicator('rev') + '</span></th>' +
  '</tr>';
  const allGroups = [];
  data.results.forEach(r => {
    r.groups.forEach(g => {
      allGroups.push({ ...g, _cat_no: r.category_no, _cat_name: r.category_name });
    });
  });
  const sorted = sortGroups(allGroups);
  const body = sorted.map(g => {
    const catLabel = '[' + g._cat_no + '] ' + g._cat_name;
    const cls = g.is_multi ? 'row-parent' : 'row-single';
    const tag = g.is_multi ? '<span class="multi-tag">' + g.variants.length + '개 옵션</span>' : '';
    const gid = g.is_multi ? 'g' + (++_gidCounter) : '';
    const toggleBtn = g.is_multi ? '<button class="toggle-btn" type="button" onclick="toggleGroup(this,\'' + gid + '\')">−</button>' : '';
    const parent =
      '<tr class="' + cls + '">' +
        '<td class="cat-cell">' + escapeHtml(catLabel) + '</td>' +
        '<td class="code-cell">' + toggleBtn + escapeHtml(g.product_code) + '</td>' +
        '<td class="name-cell">' + escapeHtml(g.product_name) + tag + '</td>' +
        '<td class="num">' + fmt(g.price, cur) + '</td>' +
        '<td class="num">' + g.qty.toLocaleString('ko-KR') + '</td>' +
        '<td class="num">' + fmt(g.rev, cur) + '</td>' +
      '</tr>';
    if (!g.is_multi) return parent;
    const children = sortVariants(g.variants, g.price).map(v => {
      const suffix = v.variant_code && v.variant_code.startsWith(g.product_code)
        ? v.variant_code.slice(g.product_code.length)
        : (v.variant_code || '');
      return '<tr class="row-child" data-group="' + gid + '">' +
        '<td class="cat-cell"></td>' +
        '<td class="code-cell">' + escapeHtml(suffix) + '</td>' +
        '<td class="name-cell">└ ' + escapeHtml(v.option || v.variant_code) + '</td>' +
        '<td class="num">' + fmt(g.price, cur) + '</td>' +
        '<td class="num">' + v.qty.toLocaleString('ko-KR') + '</td>' +
        '<td class="num">' + fmt(v.rev, cur) + '</td>' +
      '</tr>';
    }).join('');
    return parent + children;
  }).join('');
  const foot = '<tr><td colspan="4">합계</td><td class="num">' + data.grand.qty.toLocaleString('ko-KR') + '</td><td class="num">' + fmt(data.grand.rev, cur) + '</td></tr>';
  return '<div class="flat-wrap"><table><thead>' + head + '</thead><tbody>' + body + '</tbody><tfoot>' + foot + '</tfoot></table></div>';
}

function renderCatSection(r, cur) {
  return '<section class="cat-section">' +
      '<header class="cat-bar">' +
        '<span class="cat-num">' + r.category_no + '</span>' +
        '<span class="cat-name">' + escapeHtml(r.category_name) + '</span>' +
        '<span class="cat-stat">판매수<strong>' + r.qty.toLocaleString('ko-KR') + '</strong></span>' +
        '<span class="cat-stat">매출<strong>' + fmt(r.rev, cur) + '</strong></span>' +
      '</header>' +
      renderTable(r.groups, { qty: r.qty, rev: r.rev }, cur) +
    '</section>';
}

function renderSingle(data) {
  const cur = data.grand.currency;
  document.getElementById('results').innerHTML = data.results.map(r => renderCatSection(r, cur)).join('');
}

function renderTabs(data) {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  data.results.forEach((r, i) => {
    const btn = document.createElement('button');
    btn.textContent = '[' + r.category_no + '] ' + r.category_name + ' (' + r.qty + ')';
    btn.dataset.idx = i;
    btn.onclick = () => switchTab(i);
    tabs.appendChild(btn);
  });
}

function switchTab(i) {
  const data = lastResult;
  if (!data || !data.results[i]) return;
  const cur = data.grand.currency;
  document.getElementById('tabs').querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.idx, 10) === i);
  });
  const r = data.results[i];
  document.getElementById('results').innerHTML = renderTable(r.groups, { qty: r.qty, rev: r.rev }, cur);
}

function reRenderResults() {
  if (!lastResult) return;
  const mode = document.getElementById('mode').value;
  const tabs = document.getElementById('tabs');
  const results = document.getElementById('results');
  results.className = '';
  if (mode === 'tabs') {
    tabs.classList.remove('hidden');
    results.classList.add('tab-content-tabs');
    const activeBtn = document.querySelector('#tabs button.active');
    let activeIdx = activeBtn ? parseInt(activeBtn.dataset.idx, 10) : 0;
    if (!Number.isFinite(activeIdx) || activeIdx < 0 || activeIdx >= lastResult.results.length) activeIdx = 0;
    renderTabs(lastResult);
    if (lastResult.results.length > 0) switchTab(activeIdx);
  } else if (mode === 'flat') {
    tabs.classList.add('hidden');
    results.innerHTML = renderFlatTable(lastResult, lastResult.grand.currency);
  } else {
    tabs.classList.add('hidden');
    renderSingle(lastResult);
  }
}

function renderSummaryCards() {
  if (!lastResult) return;
  const cur = lastResult.grand.currency;
  let arr = [...lastResult.results];
  if (summarySort !== 'user') {
    const [by, dirStr] = summarySort.split(':');
    const d = parseInt(dirStr, 10);
    arr.sort((a, b) => {
      const va = by === 'rev' ? (a.rev || 0) : (a.qty || 0);
      const vb = by === 'rev' ? (b.rev || 0) : (b.qty || 0);
      return d === -1 ? (vb - va) : (va - vb);
    });
  }
  document.getElementById('catCards').innerHTML = arr.map(r =>
    '<div class="cat-card">' +
      '<span class="cat-no-pill">' + r.category_no + '</span>' +
      '<span class="cat-card-name">' + escapeHtml(r.category_name) + '</span>' +
      '<span class="cat-card-stats">판매수<strong>' + r.qty.toLocaleString('ko-KR') + '</strong>· 매출<strong>' + fmt(r.rev, cur) + '</strong></span>' +
    '</div>'
  ).join('');
}

function renderSummary(data, elapsed) {
  document.getElementById('summaryWrap').classList.remove('hidden');
  document.getElementById('rightTitle').textContent = '처리 로그 (완료)';

  const cur = data.grand.currency;
  let label = '총 합계 · ' + escapeHtml(data.start) + ' ~ ' + escapeHtml(data.end) + ' · 주문 ' + (data.grand.order_count || 0).toLocaleString('ko-KR') + '건';
  if (typeof elapsed === 'number') label += ' · 처리 ' + elapsed.toFixed(1) + '초';
  document.getElementById('grandSummary').innerHTML =
    '<div class="label">' + label + '</div>' +
    '<div class="num">판매수 <em>' + data.grand.qty.toLocaleString('ko-KR') + '</em>개<span class="sep">·</span>매출 <em>' + fmt(data.grand.rev, cur) + '</em> <span style="font-size:13px;color:var(--c-grand-muted)">(' + cur + ')</span></div>';

  renderSummaryCards();
}

function renderResults(data) {
  lastResult = data;
  _gidCounter = 0;
  document.getElementById('grandWrap').classList.remove('hidden');
  reRenderResults();
  document.getElementById('dl').disabled = false;
}

function run() {
  const start = document.getElementById('start').value;
  const end = document.getElementById('end').value;
  const cats = selectedCats();
  if (!start || !end) { showError('기간을 입력하세요'); return; }
  if (start > end) { showError('시작일이 종료일보다 늦습니다'); return; }
  if (!cats) { showError('카테고리를 1개 이상 선택하세요'); return; }
  lastQuery = { start, end, categories: cats, mode: document.getElementById('mode').value };
  clearError();
  document.getElementById('grandWrap').classList.add('hidden');
  document.getElementById('summaryWrap').classList.add('hidden');
  document.getElementById('rightTitle').textContent = '진행 상황';
  document.getElementById('tabs').innerHTML = '';
  document.getElementById('results').innerHTML = '';
  const prog = document.getElementById('progress');
  prog.textContent = '';
  prog.classList.remove('hidden');
  document.getElementById('dl').disabled = true;
  runStartedAt = Date.now();

  if (evt) evt.close();
  const url = '/api/report?start=' + encodeURIComponent(start) + '&end=' + encodeURIComponent(end) + '&categories=' + encodeURIComponent(cats);
  evt = new EventSource(url);
  evt.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'progress') pushProgress(m.msg);
    else if (m.type === 'error') {
      showError(m.msg + '\n\n' + (m.trace || ''));
      evt.close();
    } else if (m.type === 'data') {
      renderResults(m);
    } else if (m.type === 'done') {
      const elapsed = (Date.now() - runStartedAt) / 1000;
      if (lastResult) renderSummary(lastResult, elapsed);
      evt.close();
    }
  };
  evt.onerror = () => {
    showError('SSE 연결 오류 (네트워크/서버 확인)');
    if (evt) evt.close();
  };
}

function download() {
  if (!lastQuery) return;
  const q = lastQuery;
  const url = '/api/excel?start=' + encodeURIComponent(q.start) + '&end=' + encodeURIComponent(q.end) + '&categories=' + encodeURIComponent(q.categories) + '&mode=' + encodeURIComponent(q.mode) + '&sort_by=' + encodeURIComponent(sortBy) + '&sort_dir=' + encodeURIComponent(sortDir);
  window.location.href = url;
}

document.getElementById('run').onclick = run;
document.getElementById('dl').onclick = download;
document.getElementById('start').onchange = saveSettings;
document.getElementById('end').onchange = saveSettings;
document.getElementById('mode').onchange = () => {
  saveSettings();
  syncViewToggle();
  if (lastResult) reRenderResults();
};

function syncViewToggle() {
  const mode = document.getElementById('mode').value;
  document.querySelectorAll('#viewToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
}

document.querySelectorAll('#viewToggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    const newMode = btn.dataset.mode;
    const sel = document.getElementById('mode');
    if (sel.value === newMode) return;
    sel.value = newMode;
    sel.dispatchEvent(new Event('change'));
  });
});
document.getElementById('catSortSummary').onchange = function() {
  summarySort = this.value;
  saveSettings();
  renderSummaryCards();
};
// 페이지 로드 시 summarySort dropdown에 저장된 값 반영
if (_saved && _saved.summarySort) {
  const sel = document.getElementById('catSortSummary');
  if (sel) sel.value = _saved.summarySort;
}
window.addEventListener('error', (ev) => {
  const msg = (ev.error && ev.error.stack) ? ev.error.stack : (ev.message + '\n' + (ev.filename || '') + ':' + (ev.lineno || ''));
  try { showError('JS 에러: ' + msg); } catch (e) {}
});
window.addEventListener('unhandledrejection', (ev) => {
  const r = ev.reason;
  const msg = (r && r.stack) ? r.stack : String(r);
  try { showError('Promise 에러: ' + msg); } catch (e) {}
});
fetch('/api/version').then(r => r.json()).then(d => {
  const el = document.getElementById('versionFooter');
  if (el && d.version) {
    const started = d.started_at ? d.started_at.replace('T', ' ') : '';
    el.innerHTML = escapeHtml(d.version) + (started ? '<span class="vm">·</span>started ' + escapeHtml(started) : '');
  }
}).catch(() => {});
loadCats();
</script>
</body>
